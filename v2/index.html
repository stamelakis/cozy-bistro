<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cozy Bistro 3D</title>
    <meta name="description" content="Build, decorate, and run your own cozy bistro on a shared street — a free multiplayer restaurant tycoon that keeps cooking 24/7, even while you're away." />
    <!-- Open Graph — the preview card (picture + title) shown when the link is
         pasted into Facebook, Discord, iMessage, WhatsApp, Slack, etc. og:image
         MUST be an absolute URL; og.jpg ships from /public. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cozy Bistro 3D" />
    <meta property="og:title" content="Cozy Bistro 3D" />
    <meta property="og:description" content="Build, decorate, and run your own cozy bistro on a shared street — a free multiplayer restaurant tycoon that keeps cooking 24/7." />
    <meta property="og:url" content="https://cozy-bistro.com/" />
    <meta property="og:image" content="https://cozy-bistro.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cozy Bistro 3D — build, decorate, serve, grow" />
    <!-- Twitter/X large-image card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cozy Bistro 3D" />
    <meta name="twitter:description" content="Build, decorate, and run your own cozy bistro — a free multiplayer restaurant tycoon." />
    <meta name="twitter:image" content="https://cozy-bistro.com/og.jpg" />
    <!-- Preload the login background so it starts downloading in
         parallel with the JS bundle instead of waiting for the
         LoginModal to construct + paint its style. Cuts the perceived
         "blank background" gap when the modal first appears. -->
    <link rel="preload" as="image" href="./login-bg.png" />
    <!-- Boot watchdog. If the app hasn't put a <canvas> on screen a few seconds
         in — e.g. a WebGL failure on iOS Safari that otherwise just shows a BLACK
         SCREEN — replace the blank page with the captured error + device string so
         it can be screenshotted. Registered before the module bundle so it catches
         early/parse errors too, and ES5 so it runs on any engine. Silent for
         healthy loads (a <canvas> exists → return). -->
    <script>
      (function () {
        var errs = [];
        function cap(m) { try { errs.push(String(m)); } catch (e) {} }
        window.addEventListener("error", function (e) {
          cap((e && e.message ? e.message : "error") +
            (e && e.filename ? "  @ " + e.filename + ":" + e.lineno + ":" + e.colno : ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e ? e.reason : null;
          cap("promise: " + (r && (r.stack || r.message) ? (r.stack || r.message) : String(r)));
        });
        setTimeout(function () {
          if (document.querySelector("canvas")) return; // booted fine — stay silent
          var d = document.createElement("div");
          d.setAttribute("style", "position:fixed;inset:0;z-index:2147483647;background:#1b1410;" +
            "color:#ffe0c0;font:13px/1.6 ui-monospace,monospace;padding:20px;overflow:auto;" +
            "white-space:pre-wrap;-webkit-user-select:text;user-select:text;");
          d.textContent =
            "Cozy Bistro couldn't start the 3D view on this device.\n" +
            "Please screenshot this whole screen and send it over — it shows exactly what went wrong.\n\n" +
            "Device: " + navigator.userAgent + "\n\n" +
            (errs.length ? ("Errors:\n" + errs.join("\n\n"))
                         : "No JavaScript error was captured — most likely a WebGL / graphics limit in this browser.");
          (document.body || document.documentElement).appendChild(d);
        }, 15000);
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1b1410;
        font-family: system-ui, -apple-system, sans-serif;
        color: #fff5dc;
        overflow: hidden;
        /* Stop the browser from hijacking touch drags as pull-to-refresh
           / overscroll bounce while the player pans or pinches the 3D
           view. */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        width: 100vw;
        height: 100vh;
        /* dvh tracks the *visible* viewport as mobile browser chrome
           (URL bar) shows/hides, so the canvas never leaves a dead strip. */
        height: 100dvh;
      }
      /* The WebGL canvas must own all touch gestures (pan / pinch) — the
         browser default would scroll/zoom the page instead. UI panels keep
         their normal touch behaviour since this targets the canvas only. */
      #app canvas {
        touch-action: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">Loading Cozy Bistro 3D…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
